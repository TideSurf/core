<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #E7EBEF;
    color: #0F1820;
    font-family: "Zalando Sans", "Gothic A1", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Calm square mosaic — the same tide-texture as the landing, as a static
     colour-diff checker. No strokes, no lines. */
  .bg {
    position: absolute; inset: 0;
    background-color: #E7EBEF;
    background-image:
      linear-gradient(45deg, rgba(202,210,218,0.34) 25%, transparent 25%, transparent 75%, rgba(202,210,218,0.34) 75%),
      linear-gradient(45deg, rgba(202,210,218,0.34) 25%, transparent 25%, transparent 75%, rgba(202,210,218,0.34) 75%);
    background-size: 84px 84px;
    background-position: 0 0, 42px 42px;
  }
  .content {
    position: relative;
    padding: 96px 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    gap: 30px;
  }
  h1 {
    font-size: 212px;
    line-height: 0.86;
    font-weight: 500;
    letter-spacing: -0.045em;
    color: #0F1820;
  }
  .thesis {
    font-size: 56px;
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -0.018em;
    color: #0F1820;
    max-width: 16ch;
  }
  .install {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    width: max-content;
    padding: 0 22px 0 28px;
    height: 64px;
    background: #DAE0E6;
    font-size: 30px;
    color: #0F1820;
  }
  .install .prompt { color: #265F7E; font-weight: 600; }
  .install code { font-family: inherit; font-weight: 500; }
  .tag {
    margin-top: 6px;
    font-size: 24px;
    color: #566472;
    letter-spacing: -0.005em;
  }
  .tag b { color: #265F7E; font-weight: 600; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>TideSurf</h1>
    <p class="thesis">The live page, distilled for agents.</p>
    <div class="install"><span class="prompt">$</span><code>bun add @tidesurf/core</code></div>
    <p class="tag">Live pages as text for browser agents · <b>stable handles</b> · local CDP</p>
  </div>
</body>
</html>
