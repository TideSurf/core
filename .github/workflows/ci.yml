name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run typecheck:examples

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - run: bun install
      - run: bun run test:integration
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  cross-platform-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test test/unit/launcher.test.ts test/unit/session.test.ts test/unit/cli-process.test.ts

  node-18-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - run: bun install
      - run: bun run build
      - run: bun run smoke:pack

  release-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - run: bun install
      - run: bun run check:docs
      - run: bun run test:bench
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: bun run build
      - run: node dist/cli.js --version
      - run: bun dist/cli.js --version
      - run: bun install
        working-directory: website/landing
      - run: bun run build
        working-directory: website/landing
      - run: bun install
        working-directory: website/docs
      - run: bun run build
        working-directory: website/docs
      - run: npm pack --dry-run
      - run: bun run smoke:pack
