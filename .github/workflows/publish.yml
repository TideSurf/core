name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Skip when the version is already on the registry
        id: guard
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@tidesurf%2Fcore/${VERSION}")"
          if [ "$STATUS" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@tidesurf/core@${VERSION} is already published; skipping the publish steps."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.guard.outputs.published == 'false'
        with:
          bun-version: 1.3.14
      - run: bun run check:release
        if: steps.guard.outputs.published == 'false'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.guard.outputs.published == 'false'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        id: setup-chrome
        if: steps.guard.outputs.published == 'false'
        with:
          chrome-version: stable
          install-dependencies: true
      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.published == 'false'
      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.published == 'false'
        working-directory: website/landing
      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.published == 'false'
        working-directory: website/docs
      - run: bun run verify:release
        if: steps.guard.outputs.published == 'false'
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          TIDESURF_NO_SANDBOX: "1"
      - run: npm publish --provenance --access public
        if: steps.guard.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
